# Configuration for Space Mission Intelligence Copilot

paths:
  data_dir: "./data_storage"
  models_dir: "./models_storage"
  kb_dir: "./data_storage/vector_store"
  cache_dir: "./data_storage/cache"
  db_path: "sqlite:///./data_storage/tickets.db"

data_pipeline:
  chunk_size: 512
  chunk_overlap: 64
  # If true, limits downloaded files to a smaller number of rows for quick testing
  mock_mode: false 

models:
  retriever:
    base: "sentence-transformers/all-MiniLM-L6-v2"
    save_path: "./models_storage/retriever/"
    batch_size: 16
    epochs: 3
    learning_rate: 2.0e-5
  reranker:
    base: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    save_path: "./models_storage/reranker/"
    batch_size: 16
    epochs: 2
    learning_rate: 2.0e-5
  generator:
    base: "mistralai/Mistral-7B-Instruct-v0.2"
    save_path: "./models_storage/generator_lora/"
    batch_size: 4
    epochs: 1
    learning_rate: 2.0e-4
    lora_rank: 16
    lora_alpha: 32
  dpo:
    save_path: "./models_storage/generator_dpo/"
    batch_size: 2
    epochs: 1
    learning_rate: 5.0e-5
    beta: 0.1
  tool_policy:
    base: "bert-base-uncased"
    save_path: "./models_storage/tool_policy/"
    batch_size: 16
    epochs: 3
    learning_rate: 3.0e-5

tools:
  max_iterations: 4
  search_top_k: 5
  
server:
  host: "0.0.0.0"
  port: 8000
